<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Month Anniversary ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            z-index: 10;
            max-width: 480px;
            width: 100%;
        }

        .photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.3);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #e91e63;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 18px;
        }

        .heart {
            font-size: 2.8rem;
            animation: heartbeat 1.2s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.15); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .message {
            font-size: 1.15rem;
            color: #444;
            line-height: 1.7;
            margin: 15px 0 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 22px;
            padding: 14px 34px;
            font-size: 1.1rem;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.4);
        }

        .btn:hover {
            background: #c2185b;
            transform: translateY(-3px);
        }

        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            color: #e91e63;
            animation: float 6s linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- រូបថត (ប្តូរជារូបរបស់អ្នក) -->
        <img src="https://i.pinimg.com/1200x/08/d9/52/08d952184f71189a23ea72adf55041d7.jpg" 
             alt="Couple Photo" 
             class="photo">

        <div class="heart">❤️</div>
        <h1>ANNIVERSARY 3 MONTH WITH YOU PP SML</h1>
        <p class="subtitle">Happy 3 Month Anniversary</p>
        
        <p class="message">
            អរគុណសម្រាប់រយៈពេល ៣ ខែដ៏អស្ចារ្យសម្រាប់ពួកយើងទាំងពីរនាក់។<br>
            សូមអូនចុចខាងក្រោម ដើម្បីអានអត្ថបន្ថែម។
        </p>

        <a href="anniversary2.html" class="btn">កន្លែងនេះសម្រាប់អានអត្ថបទបន្ត💕</a>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 400);
    </script>
</body>
</html>
